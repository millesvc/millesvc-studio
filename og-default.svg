  <text x="78" y="407" font-family="Arial,sans-serif" font-size="66" font-weight="800" letter-spacing="-2" fill="url(#accent)">una web que vende</text>
  <text x="82" y="473" font-family="Arial,sans-serif" font-size="25" fill="#426779">Diseño web · E-commerce · SEO · Ventas por WhatsApp</text>
